[package]
name = "rounding-arbitrage"
version = "0.1.0"
description = "PoC — vuln-classes.md #4 rounding-direction arbitrage"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "rounding_arbitrage"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
