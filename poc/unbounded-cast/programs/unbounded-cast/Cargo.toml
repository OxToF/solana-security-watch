[package]
name = "unbounded-cast"
version = "0.1.0"
description = "PoC — vuln-classes.md #7 unbounded integer cast / truncation"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "unbounded_cast"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
