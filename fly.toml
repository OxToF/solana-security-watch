# Fly.io config for the scan backend. Rename `app` to a name you own, then:
#   fly launch --no-deploy       (first time, creates the app)
#   fly volume create sswdata -r cdg -n 1 -s 1     (1GB volume for the job store)
#   fly secrets set ADMIN_TOKEN=... MERCHANT_WALLET=7yMn... SOLANA_RPC_URL=... PAY_INSTRUCTIONS='...' RESEND_API_KEY=... MAIL_FROM=... ALLOW_ORIGIN='https://your-landing'
#   fly deploy
app = "solana-security-watch-scan"
primary_region = "cdg"

[build]
  dockerfile = "server/Dockerfile"

[env]
  PORT = "8080"
  JOBS_FILE = "/data/jobs.json"
  SCAN_PRICE_USD = "80"

[[mounts]]
  source = "sswdata"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine warm: a scan runs asynchronously after /confirm, so the box
  # must not stop mid-job. Set min to 0 only if you accept that risk to save money.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
