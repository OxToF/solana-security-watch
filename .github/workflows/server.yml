name: server
on:
  push:
    paths: ["server/**", "bin/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "bin/**", ".github/workflows/server.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test server/agent.test.mjs server/program.test.mjs
